<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>saturday-voice</title>
<style>
  body { font-family: monospace; background: #111; color: #eee; padding: 2rem; }
  button { font-size: 1rem; padding: 0.5rem 1rem; }
  #status { margin-top: 1rem; white-space: pre-wrap; }
  .state-listening { color: #6cf; }
  .state-speaking { color: #fc6; }
  .state-error { color: #f66; }
</style>
</head>
<body>
<h1>saturday-voice</h1>
<p>Minimal test client — Phase 1b. Not the real Saturday-branded client (roadmap).</p>
<button id="connect">Connect</button>
<div id="status">idle</div>

<script>
// Wire protocol (see saturday-voice/audio.go and pipeline.go):
//   binary WS messages, both directions: one frame of mono float32 PCM
//   at 24kHz, little-endian — exactly a Float32Array's own buffer layout.
//   text WS messages, server -> client only: small JSON control events,
//   {"type":"state","value":"listening"|"speaking"} and
//   {"type":"interrupted"} (clear the playback queue now).
const SAMPLE_RATE = 24000;
const SAMPLES_PER_FRAME = 1920;

const statusEl = document.getElementById("status");
const connectBtn = document.getElementById("connect");

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

async function connect() {
  connectBtn.disabled = true;
  setStatus("requesting microphone…");

  let audioCtx;
  try {
    // Requesting the context at moshi-server's own sample rate avoids
    // needing to resample client-side — most modern browsers honor this.
    audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
  } catch (e) {
    setStatus("this browser won't create a 24kHz AudioContext: " + e, "state-error");
    return;
  }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        sampleRate: SAMPLE_RATE,
        echoCancellation: true,
        noiseSuppression: true,
      },
    });
  } catch (e) {
    setStatus("microphone access denied: " + e, "state-error");
    return;
  }

  const token = new URLSearchParams(location.search).get("token") || prompt("auth token:");
  const wsURL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host +
    "/ws?token=" + encodeURIComponent(token);
  const ws = new WebSocket(wsURL);
  ws.binaryType = "arraybuffer";

  // OUTPUT_GAIN: server-side amplitude logging (2026-08-25, saturday-voice
  // log) showed a real reply peaking at 0.926 with zero samples over 1.0
  // across 104 frames — no true (sample-level) clipping, ruling that out
  // as the cause of "peaking too high, grating" reports. moshi-server's
  // output is mastered close to full scale (0.9+ peaks aren't rare
  // speech transients, they're closer to the norm), which leaves no
  // headroom against inter-sample peaks — a signal whose discrete
  // samples never exceed 1.0 can still overshoot 0 dBFS once the
  // browser's audio pipeline reconstructs it, which reads as harsh/
  // grating without ever showing up in a per-sample max check. Fixed
  // headroom via a persistent gain node, not per-frame logic — cheap,
  // and it also directly addresses "too loud the first quarter second"
  // since that's overall level, not the click FADE_IN_SEC already fixed.
  const OUTPUT_GAIN = 0.5;
  const masterGain = audioCtx.createGain();
  masterGain.gain.value = OUTPUT_GAIN;
  masterGain.connect(audioCtx.destination);

  // Playback: queue of AudioBufferSourceNodes scheduled back-to-back
  // starting from whichever is later — audioCtx.currentTime or the end of
  // the last scheduled node — so frames play in order with no gaps or
  // overlaps as they arrive.
  //
  // The very first frame of a reply used to schedule at exactly
  // audioCtx.currentTime (nextPlayTime starts at 0, so
  // Math.max(currentTime, 0) === currentTime) — zero lead time, which is
  // a known Web Audio scheduling gotcha: starting a node with no lookahead
  // gives the audio thread no room to prepare and audibly distorts the
  // first ~250-500ms. LEAD_TIME_SEC gives every fresh reply (nextPlayTime
  // reset to 0 by clearPlayback on interrupt too) a small cushion, which
  // also doubles as slack against a late-arriving frame over the WAN hop.
  //
  // 0.1s fixed the distortion but still felt abrupt live — moshi-server's
  // first audio frame apparently carries speech from sample zero, no
  // lead-in silence of its own, so whatever gap plays before src.start()
  // fires is the only "breath" the listener gets before the voice starts.
  // Bumped to 0.25s for a softer onset; still small next to the seconds
  // of thinking/TTS-dial latency already elapsed by the time audio starts.
  const LEAD_TIME_SEC = 0.25;
  // FADE_IN_SEC is a separate fix from LEAD_TIME_SEC above: lead time
  // controls WHEN playback starts (scheduling lookahead), but moshi-server's
  // first sample isn't itself silence — the waveform jumps straight from
  // nothing to a non-zero amplitude, which Web Audio plays as an audible
  // click/pop regardless of how much lookahead it got. Ramping gain 0->1
  // over a few milliseconds on just the first frame removes the
  // discontinuity without being perceptible as a fade.
  const FADE_IN_SEC = 0.02;
  let nextPlayTime = 0;
  function playFrame(floatSamples) {
    const buf = audioCtx.createBuffer(1, floatSamples.length, SAMPLE_RATE);
    buf.copyToChannel(floatSamples, 0);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const isFirstFrame = nextPlayTime === 0;
    const startAt = isFirstFrame
      ? audioCtx.currentTime + LEAD_TIME_SEC
      : Math.max(audioCtx.currentTime, nextPlayTime);
    if (isFirstFrame) {
      const fadeGain = audioCtx.createGain();
      fadeGain.gain.setValueAtTime(0, startAt);
      fadeGain.gain.linearRampToValueAtTime(1, startAt + FADE_IN_SEC);
      src.connect(fadeGain);
      fadeGain.connect(masterGain);
    } else {
      src.connect(masterGain);
    }
    src.start(startAt);
    nextPlayTime = startAt + buf.duration;
  }
  function clearPlayback() {
    // Individual sources already scheduled can't be un-scheduled without
    // tracking every node; simplest correct fix for a barge-in is to
    // just stop scheduling new audio ahead of "now" — resetting
    // nextPlayTime means the next frame plays immediately instead of
    // queued behind whatever's left, which is a reasonable approximation
    // for this minimal client. A production client would track and stop
    // each source node explicitly.
    nextPlayTime = audioCtx.currentTime;
  }

  ws.onopen = () => {
    setStatus("connected — listening", "state-listening");
    const source = audioCtx.createMediaStreamSource(stream);
    // ScriptProcessorNode's buffer size must be 0 or a power of two
    // (256-16384) — SAMPLES_PER_FRAME (1920) isn't one. The re-chunking
    // loop below already rebuilds exact SAMPLES_PER_FRAME frames from
    // whatever size the callback actually delivers, so any legal size
    // works here.
    const processor = audioCtx.createScriptProcessor(4096, 1, 1);
    let frameBuf = new Float32Array(0);

    processor.onaudioprocess = (evt) => {
      if (ws.readyState !== WebSocket.OPEN) return;
      const input = evt.inputBuffer.getChannelData(0);
      // ScriptProcessorNode's buffer size may not exactly match
      // SAMPLES_PER_FRAME on every browser; re-chunk to be safe.
      const combined = new Float32Array(frameBuf.length + input.length);
      combined.set(frameBuf);
      combined.set(input, frameBuf.length);
      let offset = 0;
      while (combined.length - offset >= SAMPLES_PER_FRAME) {
        const frame = combined.slice(offset, offset + SAMPLES_PER_FRAME);
        ws.send(frame.buffer);
        offset += SAMPLES_PER_FRAME;
      }
      frameBuf = combined.slice(offset);
    };

    source.connect(processor);
    // ScriptProcessorNode requires a destination connection to fire even
    // though we don't want its output audible — route through a
    // zero-gain node instead of destination directly.
    const silentGain = audioCtx.createGain();
    silentGain.gain.value = 0;
    processor.connect(silentGain);
    silentGain.connect(audioCtx.destination);
  };

  ws.onmessage = (evt) => {
    if (typeof evt.data === "string") {
      let msg;
      try { msg = JSON.parse(evt.data); } catch { return; }
      if (msg.type === "interrupted") {
        clearPlayback();
      } else if (msg.type === "state") {
        setStatus(msg.value, "state-" + msg.value);
      } else if (msg.type === "error") {
        setStatus(msg.message, "state-error");
      }
      return;
    }
    const floatSamples = new Float32Array(evt.data);
    playFrame(floatSamples);
  };

  ws.onclose = () => {
    setStatus("disconnected", "state-error");
    connectBtn.disabled = false;
  };
  ws.onerror = () => {
    setStatus("connection error", "state-error");
  };
}

connectBtn.addEventListener("click", connect);
</script>
</body>
</html>
